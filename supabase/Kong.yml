_format_version: "1.1"

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false

  # Realtime REST — server-side broadcast. MUST be listed before the websocket
  # route below: without it, /realtime/v1/api/broadcast is rewritten onto
  # realtime's /socket/ prefix and 404s, so every server-initiated broadcast
  # silently fails (chat delivery, email-verification success, director cuts).
  # supabase-js falls back to this REST endpoint whenever .send() is called on
  # a channel that was never subscribed, which is exactly how Tank's server
  # code broadcasts. Verified 2026-08-19: correct path returns 202.
  - name: realtime-v1-rest
    url: http://realtime:4000/api
    routes:
      - name: realtime-v1-rest-all
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors

  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  - name: studio-mcp
    url: http://studio:3000/api/mcp
    routes:
      - name: mcp
        strip_path: true
        paths:
          - /mcp
    plugins:
      - name: cors
      - name: ip-restriction
        config:
          allow:
            - 127.0.0.1
            - ::1
            - 192.168.0.0/16
            - 172.16.0.0/12
            - 10.0.0.0/8
          deny: []

