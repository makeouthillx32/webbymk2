# TURN/STUN relay for Tank's WebRTC (WHEP) delivery.
#
# MediaMTX's WHEP output only ever advertises host ICE candidates
# (mediamtx/mediamtx.yml's webrtcAdditionalHosts) — no STUN reflexive, no
# TURN relay. That works on the LAN and on permissive networks, and
# silently fails (no error, just a fallback to slower HLS) on anything
# that filters peer-to-peer UDP: corporate wifi, most cellular carriers
# (CGNAT), some strict home routers. This gives WHEP a real relay path for
# exactly that traffic instead of a silent downgrade.
#
# external-ip is the current known public IP (asuscomm.com DDNS host
# resolves here as of 2026-08-24) — coturn needs a real IP, not a
# hostname, so if the ISP-assigned public IP changes, this line needs
# updating by hand. There is no way to make this self-updating from
# inside this file alone.

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49180

realm=unenter.live
server-name=unenter.live

# public-ip/local-ip — required for NAT traversal to actually relay
# correctly from behind this router.
external-ip=173.24.124.104/192.168.50.204

# Static long-term credential. Simple, appropriate for one known
# application (Tank/MediaMTX) rather than a multi-tenant TURN deployment
# that would want time-limited REST-API credentials instead.
lt-cred-mech
user=tankturn:0xY2b1kJZciEEQpvsv7dExLWOsL3hVIj

# No TLS cert wired up for the TURN control channel itself yet — the media
# it relays is still SRTP-encrypted end-to-end via WebRTC regardless, this
# only affects the (much less sensitive) TURN allocation handshake.
no-tls
no-dtls

no-cli
fingerprint
stale-nonce=600

# Don't relay to RFC1918/loopback/link-local — a public TURN port that could
# be used to reach internal-only services is a real, well-known abuse
# pattern for open TURN relays.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
