@version: 4.11
# Remote syslog receiver for LAN gear that can only log over the network
# (the router, switches, cameras). Anything that sends RFC3164/5424 over UDP
# or TCP to this host's port 5514 lands in one file per day under
# logs/syslog/, which `unaxis logs router` reads, so agents on any machine
# can see router history over IPC instead of asking for a syslog download.
#
# Timestamps are receive time in UTC. Senders like the router stamp local
# time with no year or zone, so their own stamp is kept only as part of the
# message.

options {
  keep-hostname(no);
  use-dns(no);
  use-fqdn(no);
  create-dirs(yes);
  dir-perm(0755);
  perm(0644);
  log-msg-size(65536);
};

source s_lan {
  network(transport("udp") port(5514));
  network(transport("tcp") port(5514) max-connections(20) log-iw-size(2000));
};

destination d_daily {
  file("/var/log/remote/${R_YEAR}-${R_MONTH}-${R_DAY}.log"
       template("${R_ISODATE} ${SOURCEIP} ${PROGRAM}: ${MESSAGE}\n"));
};

log { source(s_lan); destination(d_daily); };
