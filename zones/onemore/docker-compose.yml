# zones/onemore/docker-compose.yml
# Auto-generated by UNAXIS — do not edit manually.
# Runtime wrapper: starts the onemore zone container on the shared unenter network.
#
# Core infra (db, kong, proxy) is managed by the root docker-compose.yml.
# The unenter network is external — both files share it automatically.
#
# Labels (unenter.*) allow any tool with Docker socket access to discover
# zone metadata without reading config files:
#   docker inspect unt_onemore --format '{{json .Config.Labels}}'
#
# Manual commands (run from the project root):
#   docker compose -f zones/onemore/docker-compose.yml pull
#   docker compose -f zones/onemore/docker-compose.yml up -d
#   docker compose -f zones/onemore/docker-compose.yml down

services:
  onemore:
    image: ghcr.io/makeouthillx32/unenter-onemore:latest
    build:
      context: ../..
      dockerfile: zones/onemore/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL:
        NEXT_PUBLIC_SUPABASE_URL_BROWSER:
        NEXT_PUBLIC_SUPABASE_ANON_KEY:
        NEXT_PUBLIC_APP_TITLE:
        NEXT_PUBLIC_COMPANY_NAME:
        NEXT_PUBLIC_OWNER_USERNAME:
        NEXT_PUBLIC_OWNER_EMAIL:
    container_name: unt_onemore
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NEXT_PUBLIC_ZONE: "onemore"
    labels:
      unenter.zone.key: "onemore"
      unenter.zone.label: "Onemore"
      unenter.zone.domain: "onemore.unenter.live"
      unenter.zone.layout: "app"
      unenter.zone.port: "3000"
      unenter.proxy.enabled: "true"
      unenter.proxy.upstream: "http://onemore:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - unenter

networks:
  unenter:
    external: true
