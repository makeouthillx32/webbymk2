services:
  apptest1:
    image: ghcr.io/makeouthillx32/unenter-apptest1:latest
    build:
      context: ../..
      dockerfile: zones/apptest1/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL:
        NEXT_PUBLIC_SUPABASE_URL_BROWSER:
        NEXT_PUBLIC_SUPABASE_ANON_KEY:
        NEXT_PUBLIC_APP_TITLE:
        NEXT_PUBLIC_COMPANY_NAME:
        NEXT_PUBLIC_OWNER_USERNAME:
        NEXT_PUBLIC_OWNER_EMAIL:
    container_name: unt_apptest1
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NEXT_PUBLIC_ZONE: "apptest1"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - unenter

networks:
  unenter:
    external: true
