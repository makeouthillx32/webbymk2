<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
      <linearGradient id="maskBlue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#93c5fd"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.5"/>
      </filter>
    </defs>
    <g filter="url(#shadow)" transform="translate(28, 48)">
      <!-- Ear Loops -->
      <path d="M 20 30 C -20 50, -20 90, 20 110" fill="none" stroke="#e2e8f0" stroke-width="4"/>
      <path d="M 180 30 C 220 50, 220 90, 180 110" fill="none" stroke="#e2e8f0" stroke-width="4"/>
      <!-- Main Mask Body -->
      <rect x="20" y="20" width="160" height="100" rx="12" fill="url(#maskBlue)" stroke="#1d4ed8" stroke-width="3"/>
      <!-- Pleats / Creases -->
      <line x1="20" y1="45" x2="180" y2="45" stroke="#1e40af" stroke-width="2.5"/>
      <line x1="20" y1="70" x2="180" y2="70" stroke="#1e40af" stroke-width="2.5"/>
      <line x1="20" y1="95" x2="180" y2="95" stroke="#1e40af" stroke-width="2.5"/>
      <!-- Dirt / Coffee Stains -->
      <ellipse cx="65" cy="60" rx="18" ry="12" fill="#78350f" opacity="0.6" filter="url(#shadow)"/>
      <circle cx="130" cy="80" r="14" fill="#78350f" opacity="0.5"/>
      <ellipse cx="145" cy="50" rx="10" ry="7" fill="#451a03" opacity="0.6"/>
    </g>
  </svg>