<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
      <linearGradient id="crtBeige" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f3f4f6"/>
        <stop offset="100%" stop-color="#9ca3af"/>
      </linearGradient>
      <radialGradient id="screenGlass" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#020617"/>
      </radialGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.6"/>
      </filter>
    </defs>
    <g filter="url(#shadow)">
      <!-- CRT Casing -->
      <rect x="32" y="32" width="192" height="152" rx="16" fill="url(#crtBeige)" stroke="#4b5563" stroke-width="4"/>
      <!-- Inner Screen Bezel -->
      <rect x="48" y="44" width="160" height="116" rx="10" fill="url(#screenGlass)" stroke="#1f2937" stroke-width="4"/>
      <!-- Shattered Cracks -->
      <path d="M 128 102 L 80 55 M 128 102 L 180 60 M 128 102 L 60 120 M 128 102 L 110 150 M 128 102 L 175 140 M 128 102 L 195 105 M 95 72 L 65 78 M 150 80 L 175 75 M 100 130 L 78 145" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <circle cx="128" cy="102" r="6" fill="#e0f2fe"/>
      <!-- Power LED & Button -->
      <circle cx="196" cy="170" r="4" fill="#ef4444"/>
      <rect x="168" y="167" width="14" height="6" rx="2" fill="#4b5563"/>
      <!-- Monitor Stand -->
      <polygon points="100,184 156,184 170,224 86,224" fill="#6b7280" stroke="#374151" stroke-width="3"/>
    </g>
  </svg>