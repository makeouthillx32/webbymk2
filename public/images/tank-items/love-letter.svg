<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
      <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fffbeb"/>
        <stop offset="100%" stop-color="#fde68a"/>
      </linearGradient>
      <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fef3c7"/>
        <stop offset="100%" stop-color="#fcd34d"/>
      </linearGradient>
      <radialGradient id="wax" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#f87171"/>
        <stop offset="60%" stop-color="#dc2626"/>
        <stop offset="100%" stop-color="#7f1d1d"/>
      </radialGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.5"/>
      </filter>
    </defs>
    <!-- Envelope Body -->
    <g filter="url(#shadow)" transform="translate(28, 48)">
      <rect x="0" y="0" width="200" height="140" rx="8" fill="url(#paper)" stroke="#d97706" stroke-width="3"/>
      <!-- Fold Lines -->
      <path d="M 0 0 L 100 80 L 200 0" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.7"/>
      <path d="M 0 140 L 75 60" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>
      <path d="M 200 140 L 125 60" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.6"/>
      <!-- Top Fold Flap -->
      <polygon points="0,0 200,0 100,75" fill="url(#flap)" stroke="#d97706" stroke-width="2"/>
      <!-- Red Wax Seal Heart -->
      <circle cx="100" cy="75" r="22" fill="url(#wax)"/>
      <path d="M 100 66 C 96 60, 86 60, 86 70 C 86 78, 100 86, 100 86 C 100 86, 114 78, 114 70 C 114 60, 104 60, 100 66 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </svg>