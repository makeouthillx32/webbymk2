<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
      <radialGradient id="gold" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#fff275"/>
        <stop offset="50%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#854d0e"/>
      </radialGradient>
      <radialGradient id="bronze" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#fed7aa"/>
        <stop offset="50%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#7c2d12"/>
      </radialGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="6" stdDeviation="4" flood-opacity="0.6"/>
      </filter>
    </defs>
    <!-- Key Ring -->
    <circle cx="80" cy="80" r="44" fill="none" stroke="url(#bronze)" stroke-width="12" filter="url(#shadow)"/>
    <!-- Key 1 -->
    <g transform="rotate(35 80 80)" filter="url(#shadow)">
      <circle cx="80" cy="80" r="28" fill="none" stroke="url(#gold)" stroke-width="10"/>
      <rect x="75" y="108" width="10" height="95" rx="3" fill="url(#gold)"/>
      <rect x="85" y="165" width="18" height="10" rx="2" fill="url(#gold)"/>
      <rect x="85" y="185" width="24" height="10" rx="2" fill="url(#gold)"/>
    </g>
    <!-- Key 2 -->
    <g transform="rotate(75 80 80)" filter="url(#shadow)">
      <circle cx="80" cy="80" r="26" fill="none" stroke="url(#bronze)" stroke-width="10"/>
      <rect x="75" y="106" width="10" height="90" rx="3" fill="url(#bronze)"/>
      <rect x="85" y="160" width="16" height="9" rx="2" fill="url(#bronze)"/>
      <rect x="85" y="178" width="20" height="9" rx="2" fill="url(#bronze)"/>
    </g>
  </svg>