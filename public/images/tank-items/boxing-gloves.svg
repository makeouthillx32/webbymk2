<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
      <radialGradient id="leather" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#f87171"/>
        <stop offset="50%" stop-color="#dc2626"/>
        <stop offset="100%" stop-color="#450a0a"/>
      </radialGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="6" stdDeviation="5" flood-opacity="0.6"/>
      </filter>
    </defs>
    <!-- Left Glove -->
    <g filter="url(#shadow)" transform="translate(18, 30) rotate(-15 70 90)">
      <path d="M 40 90 C 20 60, 40 20, 80 20 C 120 20, 135 60, 125 100 C 120 120, 105 130, 80 130 C 50 130, 45 110, 40 90 Z" fill="url(#leather)"/>
      <!-- Thumb -->
      <path d="M 40 60 C 15 65, 20 95, 45 95 Z" fill="url(#leather)"/>
      <!-- Wristband -->
      <rect x="52" y="125" width="56" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <line x1="80" y1="125" x2="80" y2="155" stroke="#dc2626" stroke-width="3"/>
    </g>
    <!-- Right Glove -->
    <g filter="url(#shadow)" transform="translate(90, 40) rotate(15 90 90)">
      <path d="M 60 90 C 40 60, 60 20, 100 20 C 140 20, 155 60, 145 100 C 140 120, 125 130, 100 130 C 70 130, 65 110, 60 90 Z" fill="url(#leather)"/>
      <!-- Thumb -->
      <path d="M 145 60 C 170 65, 165 95, 140 95 Z" fill="url(#leather)"/>
      <!-- Wristband -->
      <rect x="72" y="125" width="56" height="30" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <line x1="100" y1="125" x2="100" y2="155" stroke="#dc2626" stroke-width="3"/>
    </g>
  </svg>