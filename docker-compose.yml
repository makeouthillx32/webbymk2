# Compose PROJECT NAME — must be a plain token ([a-z0-9_-]); dots are illegal,
# so this can't be "unenter.live". The dotted identity lives in the labels
# (unaxis.project / unaxis.domain = "unenter.live") where dots are legal.
# Volumes below are pinned to their original webbymk2_ names so this project
# rename does NOT orphan the production DB data.
#
# Set to "unenterlive" to MATCH the actually-running production stack (its
# containers carry com.docker.compose.project=unenterlive since first bring-up).
# A prior edit set this to "unenter" as an intended rename, but core deploy was
# broken (compose service-resolution bug) so the rename never reached the
# running stack — the mismatch then blocked every core deploy with a container
# name conflict. With one project managing one domain, the token is just a
# label; matching reality is the least-surprise state. Revisit only if the
# platform ever grows to multiple projects. (2026-07-11)
name: unenterlive

networks:
  unenter:
    driver: bridge
    name: unenter   # explicit name prevents docker-compose project-prefix (webbymk2_unenter)
                    # zone compose files reference this as: networks.unenter: external: true

volumes:
  unt-storage-data:
    name: webbymk2_unt-storage-data
  unt-db-data:
    name: webbymk2_unt-db-data
  # DINOv2 weights, fetched by torch.hub on the learner's first start.
  unt-learner-torch:
    name: webbymk2_unt-learner-torch
  # MediaMTX recording staging area — see the mediamtx service for why this is
  # a small bounded buffer rather than the archive itself.
  # unt-ink-modules and unt-tui-modules removed — TUI now runs natively via Bun (tui/run.ps1)

services:

  db:
    image: supabase/postgres:15.8.1.060
    container_name: unt_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: supabase_admin
    volumes:
      - unt-db-data:/var/lib/postgresql/data
      - ./supabase/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "data"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  kong:
    image: kong:2.8.1
    container_name: unt_kong
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,ip-restriction,proxy-cache
      # Trust X-Forwarded-* from inside the compose network only.
      #
      # Without this Kong REGENERATES those headers from the incoming Host,
      # after its plugins have run — so an internal call to http://kong:8000
      # reached GoTrue as X-Forwarded-Host: kong, and every signup email linked
      # to http://kong/auth/v1/verify, which no browser can resolve. Scoped to
      # the docker subnet rather than 0.0.0.0/0: public traffic arrives via NPM,
      # which is on this network and sets these headers correctly anyway.
      KONG_TRUSTED_IPS: 172.18.0.0/16
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_LOG_LEVEL: warn
      # GoTrue can return large auth response headers when a user's JWT carries
      # non-trivial metadata. Kong's default one-page Nginx proxy header buffer
      # rejects those responses with "upstream sent too big header" and turns a
      # valid password grant into a 502. Keep this comfortably above the JWTs
      # we issue, and scale the associated Nginx pool/busy limits together so
      # its startup-time buffer invariants remain valid.
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: "64k"
      KONG_NGINX_PROXY_PROXY_BUFFERS: "8 64k"
      KONG_NGINX_PROXY_PROXY_BUSY_BUFFERS_SIZE: "128k"
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  auth:
    image: supabase/gotrue:v2.151.0
    container_name: unt_auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-https://db.unenter.live}
      # The GOTRUE_-prefixed form is the one this image actually reads.
      #
      # Without it GoTrue builds every confirmation link from the request Host,
      # and the app reaches Supabase over the internal network as http://kong:8000
      # — so signup emails went out linking to `http://kong/auth/v1/verify?...`,
      # which no browser can resolve (DNS_PROBE_POSSIBLE). Every email signup was
      # unverifiable; two real accounts were stranded before this was found.
      # The unprefixed name above is kept because it feeds the OAuth redirect
      # URIs below.
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL:-https://db.unenter.live}
      # Which forwarded hosts GoTrue will believe when building email links.
      #
      # It trusts X-Forwarded-Host over API_EXTERNAL_URL, and Kong regenerates
      # that header from the incoming Host AFTER its plugins run — so internal
      # calls to http://kong:8000 produced http://kong/... links that no browser
      # can resolve. Naming the only legitimate host here makes GoTrue reject
      # "kong" and fall back to API_EXTERNAL_URL above.
      GOTRUE_MAILER_EXTERNAL_HOSTS: db.unenter.live
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth is REQUIRED. GoTrue's migrator reads an unqualified
      # `schema_migrations`; supabase_admin's search_path puts public first, so
      # it was reading a stale public.schema_migrations (stopped at 2022-11) and
      # replaying migration 20221208132122 forever — which fails with
      # "operator does not exist: uuid = text" against the modern auth schema.
      # Pinning the path makes it read auth.schema_migrations, the real history.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-https://unenter.live}
      # .env's ADDITIONAL_REDIRECT_URLS was never actually wired to GoTrue —
      # dead config. GOTRUE_SITE_URL alone (www.unenter.live) is GoTrue's only
      # allowed OAuth redirect target, so moving sign-in to auth.unenter.live
      # (2026-08-17) broke Google/Apple/Facebook OAuth with a 400 "redirect_to
      # not allowed" the moment the callback tried to land on the new zone.
      # Wildcard covers every current and future path on both hosts.
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-https://www.unenter.live,http://localhost:3000},https://auth.unenter.live/**,https://www.unenter.live/**,https://tank.unenter.live/**
      # External OAuth providers. Redirect URI registered in each provider's
      # console is the same for all three — Kong's public callback endpoint,
      # not our app: https://db.unenter.live/auth/v1/callback
      # GoTrue's config parser fatals (crash-loop) if these are an empty
      # string rather than a literal "true"/"false" — ${VAR:+true} alone
      # produces "" when the var is unset, which is invalid. Explicit
      # per-provider ENABLED flags in .env avoid that trap.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL:-https://db.unenter.live}/auth/v1/callback
      GOTRUE_EXTERNAL_FACEBOOK_ENABLED: ${FACEBOOK_ENABLED:-false}
      GOTRUE_EXTERNAL_FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      GOTRUE_EXTERNAL_FACEBOOK_SECRET: ${FACEBOOK_CLIENT_SECRET}
      GOTRUE_EXTERNAL_FACEBOOK_REDIRECT_URI: ${API_EXTERNAL_URL:-https://db.unenter.live}/auth/v1/callback
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${API_EXTERNAL_URL:-https://db.unenter.live}/auth/v1/callback
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      # THE cause of "randomly logged out after ~30 minutes", diagnosed
      # 2026-09-10. Unset, GoTrue defaults this to 0: a rotated refresh token
      # reused even once immediately revokes the whole token family and
      # destroys the session.
      #
      # Every zone shares ONE cookie on .unenter.live, so several tabs (or the
      # middleware and a client tab) refresh the same token concurrently. The
      # audit log showed the signature exactly: two token_refreshed events 5ms
      # apart on one session, and 76 token_refreshed -> token_revoked pairs
      # with an average gap of 0.00s. That is not a timeout, it is GoTrue
      # correctly applying a theft-detection rule to what is really a race.
      #
      # 10s is what Supabase's own hosted platform uses: long enough to absorb
      # concurrent refreshes, short enough that a genuinely stolen token is
      # still caught.
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: ${GOTRUE_REFRESH_TOKEN_REUSE_INTERVAL:-10}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-unenter.live}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_LOG_LEVEL: warn
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: unt_rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_LOG_LEVEL: warn
      # Never explicitly set before 2026-09-04 — PostgREST was silently
      # running on its built-in default (10 connections) the whole time.
      # Confirmed live: repeated PGRST003 "Timed out acquiring connection
      # from connection pool" errors (Tank's camera-clip-metadata lookups,
      # and very likely the "/slots" chat command's 500s reported the same
      # night) while Postgres itself had 56 of 100 connection slots free —
      # PostgREST was capping itself well below what the DB can actually
      # serve, not the DB being under real pressure. 30 leaves Kong and
      # every other consumer of the DB's 100-connection ceiling comfortable
      # room; raise further only if `pg_stat_activity` shows real headroom
      # being used, not just because a burst of errors reappears.
      PGRST_DB_POOL: "30"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  realtime:
    image: supabase/realtime:v2.25.50
    container_name: unt_realtime
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      ANON_KEY: ${ANON_KEY}
    command: >
      sh -c "/app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: unt_imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
    volumes:
      - unt-storage-data:/var/lib/storage:ro
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  storage:
    image: ghcr.io/supabase/storage-api:v1.37.8
    container_name: unt_storage
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # Raised from 50 MB so the archive can store real footage: a 10-minute
      # 1080p segment is ~225 MB. This is only the GLOBAL ceiling — every
      # bucket carries its own, tighter file_size_limit in storage.buckets
      # (tank-archives 512 MB, tank-loops 25 MB, image buckets 10 MB or less),
      # so raising this does not let a 1 GB avatar through.
      FILE_SIZE_LIMIT: 1073741824
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-us-east-1}
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - unt-storage-data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      imgproxy:
        condition: service_started
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: unt_meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  studio:
    image: supabase/studio:latest
    container_name: unt_studio
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # Studio is a Next standalone server, which binds to $HOSTNAME -- by
      # default the container id, so nothing answers on localhost and the
      # image's own healthcheck (which probes localhost:3000) can never pass.
      # It had failed 23,288 times in a row since the 2026-09-16 reboot, which
      # showed "Database & API: Degraded" on status.unenter.live the whole time
      # while Studio itself was serving fine.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-unenter}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-unenter.live}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:8001
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      STORAGE_IMGPROXY_URL: http://imgproxy:5001
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
      meta:
        condition: service_started
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  # ── Reverse proxy ─────────────────────────────────────────────────────────────
  # Routes requests to the correct zone by Host header (subdomain).
  # Both server.js and routes.json are bind-mounted from the host — no image
  # rebuild ever needed. Node --watch auto-restarts on server.js changes;
  # routes.json is hot-reloaded via fs.watch inside the server. Zone creation
  # and proxy code changes both take effect with zero container rebuilds.
  # UPSTREAM_* env vars below are kept as a cold-start fallback only.
  #
  # Port 8888 hosts the embedded UNAXIS agent API (TOFU ECDSA P-256).
  # docker.sock is mounted so the agent can proxy Docker API calls to the TUI.
  proxy:
    image: webbymk2-proxy          # local tag — not pushed to GHCR
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: unt_proxy
    restart: unless-stopped
    # Local-dev override: the GHCR/prod image CMD is plain `node server.js`
    # (no watcher). Here server.js + agent.js are bind-mounted, so run with
    # --watch to keep the zero-rebuild hot-reload workflow alive.
    command: ["node", "--watch", "server.js"]
    ports:
      - "3080:3080"
      - "127.0.0.1:3081:3081"
      - "127.0.0.1:8888:8888"   # UNAXIS agent API — localhost only
    volumes:
      - ./proxy-config:/proxy-config
      - ./proxy/server.js:/proxy/server.js:ro
      - ./proxy/agent.js:/proxy/agent.js:ro           # unified agent — node --watch hot-reloads on save
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for agent proxy
    environment:
      PROXY_PORT:         "3080"
      CORE_DOMAIN:        "${CORE_DOMAIN:-unenter.live}"
      AGENT_PORT:         "8888"                       # TOFU — no secret needed, first TUI to connect pairs automatically
      AGENT_STATE_FILE:   "/proxy-config/agent-state.json"  # embedded context — state in proxy-config volume
      STATUS_PUBLIC_KEY:  "${STATUS_PUBLIC_KEY}"             # gates GET /__status-api/public — set in .env, kept out of git
      # Fallback env vars — used only if proxy-config/routes.json is missing.
      UPSTREAM_UNENTER:   "http://unt_app:3000"
      UPSTREAM_BLOG:      "http://blog:3000"
      UPSTREAM_DASHBOARD: "http://unt_app:3000"
      UPSTREAM_SHOP:      "http://shop:3000"
      UPSTREAM_APP:       "http://unt_app:3000"
      UPSTREAM_AUTH:      "http://authzone:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "proxy"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"


  # ── Zone services ─────────────────────────────────────────────────────────────
  # All four zones share the same .env via env_file — one file rules them all.
  #
  # env_file injects every var from .env into the container at runtime.
  # build.args uses bare names (no value) so docker-compose resolves them
  # from .env automatically — add a new NEXT_PUBLIC_* to .env once and it
  # flows to every zone build without touching this file.
  #
  # The only per-zone overrides are:
  #   NEXT_PUBLIC_ZONE  — zone identity, differs per service
  #   STRIPE_*          — shop-only secrets (already in .env, injected via env_file)
  # ──────────────────────────────────────────────────────────────────────────────

  # ── Tank media gateway ────────────────────────────────────────────────────────
  # Republishes camera sources as browser-playable WHEP (WebRTC) and HLS.
  # Nothing in the platform produced watchable video before this — the tank zone
  # code (src/zones/tank/server/mediaGateway.ts) has always expected something
  # answering at TANK_WHEP_PUBLIC_BASE_URL / TANK_HLS_PUBLIC_BASE_URL, but no
  # such service was ever deployed. This is that service.
  #
  # No camera paths are hand-defined — Tank's server auto-provisions a path
  # for every online camera via this container's control API (9997, internal
  # only — deliberately not in the ports list below), pulling each camera's
  # own SRT "video out" port from the SRT Receiver Manager. No camera
  # credentials ever pass through this container or any file in this repo.
  # See mediamtx/mediamtx.yml and src/zones/tank/server/receiverManager.ts.
  #
  # This is additive to the core stack — bring it up with the scoped command so
  # you don't touch anything else already running:
  #   docker compose up -d mediamtx
  mediamtx:
    # -ffmpeg variant: cameras needing audio transcode (e.g. PCM A-law -> Opus)
    # run their runOnInit ffmpeg command inside this container's own process
    # namespace (see provisionMediaMtxCamera in mediaGateway.ts) — the base
    # image has no ffmpeg binary at all, which silently crash-loops that path
    # every ~5s with no visible error anywhere except this container's own
    # logs. Confirmed 2026-08-16: Cam0 (transcode-required) never connected
    # until this switch; Cam1 (embedded audio, no transcode) worked fine on
    # the base image the whole time, which is why only one of two cameras
    # was affected.
    # Built from mediamtx/Dockerfile: the stock image is the -ffmpeg variant
    # plus curl, because BusyBox wget silently truncates binary request bodies
    # and the recording hook has to upload MP4 segments. See that file.
    # NVENC build: Ubuntu 24.04 (glibc) + ffmpeg 6.1 + curl + the MediaMTX
    # binary. The previous Alpine image could not do hardware encoding for two
    # independent reasons — musl cannot load the glibc driver libraries the
    # NVIDIA runtime injects, and its ffmpeg had no nvenc encoders compiled in.
    # Measured here: libx264 veryfast costs 30.4 CPU seconds per 60s of 720p30
    # against 3.2s for h264_nvenc. See mediamtx/Dockerfile.nvenc.
    image: unenter/mediamtx:1.20.0-nvenc
    init: true
    # A ceiling, not a target — and it counts TASKS (threads), not processes.
    # 512 was set from a process count and immediately wedged the container:
    # ~25 ffmpeg jobs with CUDA run several hundred threads between them, so
    # hooks hit "Cannot fork" and even `docker exec` failed with
    # "procReady not received" at only 31 processes.
    #
    # Steady state measures in the hundreds of tasks. 4096 leaves generous
    # headroom while still bounding a runaway: the hook storm that took the
    # house down five times ran ~87 new processes a second and would cross
    # this in seconds, failing loudly inside the container instead of
    # silently starving the host of PIDs.
    pids_limit: 4096
    build:
      context: ./mediamtx
      dockerfile: Dockerfile.nvenc
    container_name: unt_mediamtx
    # Ceiling: 5-6 GB for six GPU transcoders; a leaking relay must not take the VM with it.
    mem_limit: 10g
    # WHY THIS EXISTS — measured 2026-09-12.
    #
    # mediamtx.yml points webrtcICEServers2 at turn:media.tank.unenter.live:3478.
    # Inside this container that name resolves to the PUBLIC WAN IP
    # (173.24.124.104), so MediaMTX tried to allocate a TURN relay by leaving the
    # network and coming back in through the router. That hairpin never
    # completes, so ICE gathering stalled until its internal timeout and only
    # THEN answered the WHEP POST.
    #
    # Measured: a valid offer posted to localhost:8889 — no proxy, no browser —
    # took 8.7s to return 201. Every viewer paid that per camera, which is why
    # clicking a room took minutes.
    #
    # Mapping the name to the LAN address fixes MediaMTX's own lookup while
    # leaving the advertised URL string untouched, so remote browsers still
    # receive a public TURN address they can actually reach. Pointing
    # webrtcICEServers2 itself at the LAN IP would have broken exactly those
    # viewers.
    extra_hosts:
      - "media.tank.unenter.live:192.168.50.204"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ZOMBIES=$$(ps aux | grep -c '<defunct>') && echo \"zombies=$${ZOMBIES}\" && test $${ZOMBIES} -lt 50"]
      interval: 300s
      timeout: 5s
      retries: 2
    # `video` alongside `gpu` is required: without it the runtime injects CUDA
    # but NOT libnvidia-encode, and every nvenc rung dies at startup with a
    # misleading "Cannot load libnvidia-encode.so.1".
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    ports:
      - "8889:8889"        # WHEP (HTTP, WebRTC signaling)
      - "8189:8189/udp"    # WebRTC ICE media
      # OBS / Streamlabs ingest. Safe to expose ONLY because publishing is now
      # authorised per-attempt by Tank (authMethod: http in mediamtx.yml) —
      # the previous `user: any` publish grant would have made this an open
      # ingest for anyone on the internet.
      - "1935:1935"        # RTMP publish
    expose:
      - "8888"             # HLS (HTTP, internal unenter network)
    environment:
      # Consumed by mediamtx/scripts/on-segment-complete.sh, which runs INSIDE
      # this container (it is the only one in the stack with ffmpeg). Kong is
      # reachable container-to-container on the shared `unenter` network.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      TANK_ARCHIVE_NOTIFY_URL: ${TANK_ARCHIVE_NOTIFY_URL:-http://unt_tank:3000/api/tank/archive/segment-complete}
      TANK_ARCHIVE_INGEST_SECRET: ${TANK_ARCHIVE_INGEST_SECRET}
      # Consumed by mediamtx/scripts/archive-transcode.sh — the AV1 converter
      # runs here because this is the only container with ffmpeg and the GPU.
      TANK_ARCHIVE_LOCAL_ROOT: ${TANK_ARCHIVE_LOCAL_ROOT:-/archive}
      TANK_ARCHIVE_TRANSCODE_URL: ${TANK_ARCHIVE_TRANSCODE_URL:-http://unt_tank:3000/api/tank/archive/transcode}
      TANK_ARCHIVE_TRANSCODE_BATCH: ${TANK_ARCHIVE_TRANSCODE_BATCH:-3}
      TANK_ARCHIVE_TRANSCODE_INTERVAL: ${TANK_ARCHIVE_TRANSCODE_INTERVAL:-900}
      # The viewer facade is intentionally a full two-minute recent clip.
      # Keep this deterministic: a long-running UNAXIS process can retain an
      # older inherited value and override .env during a scoped recreate.
      TANK_PREROLL_SECONDS: 120
      # Per-path recent-clip worker. Fixed cameras are stability-gated against
      # the receiver manager's safe telemetry endpoint; OBS uses MediaMTX path
      # readiness. At most two GPU encodes run together after a stack restart.
      TANK_RECEIVER_MANAGER_URL: ${SRT_MANAGER_INTERNAL_URL:-http://host.docker.internal:5050}
      TANK_CLIP_REFRESH_SECONDS: ${TANK_CLIP_REFRESH_SECONDS:-600}
      TANK_CLIP_RETRY_SECONDS: ${TANK_CLIP_RETRY_SECONDS:-60}
      TANK_CLIP_MAX_CONCURRENT: ${TANK_CLIP_MAX_CONCURRENT:-2}
      TANK_CLIP_MIN_BITRATE_KBPS: ${TANK_CLIP_MIN_BITRATE_KBPS:-500}
      # Where the OBS room lifecycle hooks report signal start/stop.
      TANK_OBS_SIGNAL_URL: ${TANK_OBS_SIGNAL_URL:-http://unt_tank:3000/api/tank/obs/signal}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/scripts:/scripts:ro
      # Local staging spool. Deliberately small and bounded: recordings land
      # here, get uploaded to Supabase, and are expired by MediaMTX's own
      # recordDeleteAfter. At 6 cameras x ~3 Mbps this is ~8 GB/hour, so the
      # 2h retention below caps it around 16 GB — it is a retry buffer, NOT
      # the archive. The 24h archive lives in Supabase Storage.
      # PROTOCOL: nothing Tank-related lives on C:.
      #
      # This spool is pure churn — a segment is written, uploaded, and deleted
      # two hours later. Docker's virtual disk grows on every write and never
      # shrinks on delete, so running this inside the VHDX grew that file all
      # night and took C: to 5.5% free, which killed the core Supabase stack.
      # A host bind mount writes to the real filesystem, where deletes actually
      # return the space.
      # PROTOCOL: nothing Tank-related on C:. This spool is pure churn — write
      # a segment, upload it, delete it two hours later. Inside Docker's virtual
      # disk that churn grows the VHDX forever (it grows on write, never shrinks
      # on delete), which is what took C: to 5% and killed the core stack.
      - U:/tank-spool:/recordings
      # The archive destination: external network share on ASUS GT-BE98_PRO router
      # with 852 GB free headroom, completely isolated from host drives and Docker VHDX.
      - /mnt/host/v/tank-archive:/archive
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "media"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  # ── TURN/STUN relay for WebRTC (WHEP) ────────────────────────────────────
  # See coturn/turnserver.conf for why this exists: MediaMTX's WHEP output
  # only advertises host ICE candidates, so anyone not on the LAN or a
  # permissive network silently falls back to slower HLS today. This gives
  # WHEP a real relay path for that traffic instead.
  #
  # Additive to the core stack, same as mediamtx — bring it up scoped:
  #   docker compose up -d coturn
  #
  # REQUIRES A ROUTER-LEVEL PORT FORWARD nothing in this repo can do:
  # UDP+TCP 3478 and UDP 49160-49180 forwarded to this host's LAN IP. Ask
  # for the exact router steps rather than assuming they're done.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: unt_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49180:49160-49180/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "media"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  app:
    image: ghcr.io/makeouthillx32/unenter:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_URL_BROWSER: ${NEXT_PUBLIC_SUPABASE_URL_BROWSER}
        NEXT_PUBLIC_APP_TITLE: ${NEXT_PUBLIC_APP_TITLE}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME}
        NEXT_PUBLIC_OWNER_USERNAME: ${NEXT_PUBLIC_OWNER_USERNAME}
        NEXT_PUBLIC_OWNER_EMAIL: ${NEXT_PUBLIC_OWNER_EMAIL}
    container_name: unt_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-127.0.0.1:3000}:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_ZONE: "unenter"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "core"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  # The house's eyes. Detection used to run only in whichever browser had the
  # director-configuration page open — close the tab and the director went
  # blind. This is the same decoder and the same identity catalog, in a
  # supervised process that never stops.
  #
  # Not profiled off by default, but it is the one service that is pure
  # consumer: if it is down, Tank and the cameras are unaffected and the
  # director simply falls back to whatever telemetry a browser posts.
  tank-vision-worker:
    # Explicit tag, same as mediamtx: a registered UNAXIS service should be
    # inspectable by name (`docker images`, `unaxis env images`) rather than
    # carrying a compose-generated project-prefixed name.
    image: unenter/tank-vision-worker:0.1.3
    build:
      # Repo root, not the service dir: the worker imports the decoder and the
      # detection catalog from src/zones/tank/ by relative path so browser and
      # server can never drift. See the Dockerfile.
      context: .
      dockerfile: services/tank-vision-worker/Dockerfile
    container_name: unt_tank_vision
    # Ceiling (uses ~1.4 GB incl. the naming process).
    mem_limit: 3g
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      TANK_ARCHIVE_INGEST_SECRET: ${TANK_ARCHIVE_INGEST_SECRET}
      TANK_BASE_URL: ${TANK_VISION_TANK_BASE_URL:-http://unt_tank:3000}
      # HLS is exposed on the internal network only, which is exactly where
      # this runs. 9997 is MediaMTX's control API, used for path readiness.
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://unt_mediamtx:9997}
      MEDIAMTX_HLS_URL: ${TANK_VISION_MEDIAMTX_HLS_URL:-http://unt_mediamtx:8888}
      MEDIAMTX_API_TOKEN: ${MEDIAMTX_API_TOKEN:-}
      TANK_VISION_CAPTURE_FPS: ${TANK_VISION_CAPTURE_FPS:-1}
      TANK_VISION_INFERENCE_INTERVAL_MS: ${TANK_VISION_INFERENCE_INTERVAL_MS:-600}
      TANK_VISION_WASM_THREADS: ${TANK_VISION_WASM_THREADS:-1}
      TANK_VISION_ROOMS: ${TANK_VISION_ROOMS:-}
      TANK_VISION_CAMERA_DENY: ${TANK_VISION_CAMERA_DENY:-}
      TANK_VISION_LOG_DETECTIONS: ${TANK_VISION_LOG_DETECTIONS:-1}
      # People are named from the operator's graded gallery (read-only mount
      # below; reloaded when a gallery rebuild rewrites it). One thread for the
      # re-id model so naming never competes with detection.
      TANK_GALLERY_DIR: /gallery
      TANK_VISION_REID_THREADS: ${TANK_VISION_REID_THREADS:-1}
    volumes:
      - ./services/tank-vision-gpu/out/gallery:/gallery:ro
    depends_on:
      mediamtx:
        condition: service_started
      kong:
        condition: service_started
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "tank-vision"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"

  # The AI-mode learner (services/tank-vision-gpu/tools/live_learner.py).
  #
  # Two jobs, both gated on the director: while it is on AI it names the bodies
  # in frame from the operator's graded gallery and posts them as the director's
  # identity overlay, and in "auto" -- the roam-anywhere mode -- it also collects
  # sightings for the operator to grade at /house/labels. A hand on the controls
  # (manual mode, or a browser pilot lease) stops it dead: cameras released,
  # CUDA freed. It was a detached host process until 2026-09-17, which did not
  # survive a reboot.
  #
  # Weights, the graded gallery and the run state are mounted, not baked: the
  # gallery changes every time the operator grades a group.
  tank-vision-learner:
    image: unenter/tank-vision-learner:0.1.0
    build:
      context: .
      dockerfile: services/tank-vision-gpu/Dockerfile
    container_name: unt_tank_learner
    restart: unless-stopped
    # 1 fps is plenty to catch a sighting and costs half of 2 fps. Raise it back
    # with `--fps 2` when the house PC is idle.
    command: ["--fps", "1"]
    environment:
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      TANK_ARCHIVE_INGEST_SECRET: ${TANK_ARCHIVE_INGEST_SECRET}
      TANK_BASE_URL: ${TANK_VISION_TANK_BASE_URL:-http://unt_tank:3000}
      # RTSP is internal-only, which is where this runs: no docker exec needed.
      TANK_LEARNER_RTSP: ${TANK_LEARNER_RTSP:-rtsp://unt_mediamtx:8554/cameras/{camera}-hls-low}
      # Empty: grading crops live in the tank-identity-crops bucket, and this
      # container's view of the V: share cannot be trusted after a reboot.
      TANK_LEARNER_CROP_DIR: ""
    volumes:
      - ./services/tank-vision-gpu/models:/app/models:ro
      - ./services/tank-vision-gpu/out:/app/out
      - unt-learner-torch:/root/.cache/torch
    deploy:
      resources:
        limits:
          # Offline work must always lose to live work: the box has 32 threads.
          cpus: "4"
          # Ceiling: ~0.3 GB idle, ~4 GB while enrolling.
          memory: 6g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      mediamtx:
        condition: service_started
      kong:
        condition: service_started
    networks:
      - unenter
    labels:
      unaxis.managed: "true"
      unaxis.version: "${UNAXIS_VERSION:-dev}"
      unaxis.project: "unenter.live"
      unaxis.domain: "unenter.live"
      unaxis.role: "tank-learner"
      unaxis.source-ref: "${UNAXIS_SOURCE_REF:-unknown}"
